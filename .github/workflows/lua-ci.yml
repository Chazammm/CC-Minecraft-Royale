name: Lua CI

on:
  push:
    paths-ignore:
      - "reports/**"
  pull_request:
    paths-ignore:
      - "reports/**"

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/assets/
          sparse-checkout-cone-mode: false
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua5.2
      - name: Syntax check
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Lua 5.2 compatibility syntax
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.2 -p
      - name: Lua 5.2 compatibility smoke
        run: |
          lua5.2 tests/test_v1.lua
          lua5.2 tests/test_audit_regressions.lua
          lua5.2 tests/test_headless_runner.lua
          lua5.2 tests/test_side_symmetry.lua
          lua5.2 tests/test_refactor_parity.lua
          lua5.2 tests/test_audit_hardening_20261010.lua
          lua5.2 tests/test_audit_fixes_20261010.lua
          lua5.2 tests/test_release_gate.lua
          lua5.2 tests/test_mechanics_full_ci.lua
      - name: V1 smoke tests
        run: lua5.4 tests/test_v1.lua
      - name: Platform stub tests
        run: lua5.4 tests/test_platform_stubs.lua
      - name: Audit regression tests
        run: lua5.4 tests/test_audit_regressions.lua
      - name: CLI and manifest tests
        run: lua5.4 tests/test_cli_manifest.lua
      - name: Installer manifest tests
        run: lua5.4 tests/test_install_manifest.lua
      - name: Headless runner parity tests
        run: lua5.4 tests/test_headless_runner.lua
      - name: Side symmetry tests
        run: lua5.4 tests/test_side_symmetry.lua
      - name: Audit follow-up tests
        run: lua5.4 tests/test_audit_followups.lua
      - name: Recovery hardening tests
        run: lua5.4 tests/test_recovery_hardening.lua
      - name: Refactor parity tests
        run: lua5.4 tests/test_refactor_parity.lua
      - name: Installer and combat hardening regressions
        run: lua5.4 tests/test_audit_hardening_20261010.lua
      - name: Third-audit regression tests
        run: lua5.4 tests/test_audit_fixes_20261010.lua
      - name: Audit register and release quality gate
        run: lua5.4 tests/test_release_gate.lua
      - name: Deep-audit preset filesystem false-return tests
        run: |
          lua5.2 tests/test_preset_false_returns.lua
          lua5.4 tests/test_preset_false_returns.lua
      - name: Installer and GitHub credential filesystem fault injection
        run: |
          lua5.2 tests/test_installer_false_returns.lua
          lua5.4 tests/test_installer_false_returns.lua
          lua5.2 tests/test_report_logout_false.lua
          lua5.4 tests/test_report_logout_false.lua
      - name: GitHub token setup write, close and readback fault injection
        run: |
          lua5.2 tests/test_report_token_write_failures.lua
          lua5.4 tests/test_report_token_write_failures.lua
      - name: Atomic persistence fault injection - silent writes and renames
        run: |
          lua5.2 tests/test_preset_transaction_integrity.lua
          lua5.4 tests/test_preset_transaction_integrity.lua
          lua5.2 tests/test_atomic_token_reconfig.lua
          lua5.4 tests/test_atomic_token_reconfig.lua
      - name: Credential backup recovery across interrupted updates
        run: |
          lua5.2 tests/test_token_backup_recovery.lua
          lua5.4 tests/test_token_backup_recovery.lua
      - name: Benchmark report publish byte-integrity oracle
        run: |
          lua5.2 tests/test_report_transaction_integrity.lua
          lua5.4 tests/test_report_transaction_integrity.lua
      - name: Music seek failure and no-progress fault injection
        run: |
          lua5.2 tests/test_music_seek_failures.lua
          lua5.4 tests/test_music_seek_failures.lua
      - name: Deterministic live-core state invariant stress
        run: |
          lua5.2 tests/test_core_invariant_stress.lua
          lua5.4 tests/test_core_invariant_stress.lua
      - name: Full in-game mechanics suite
        run: lua5.4 tests/test_mechanics_full_ci.lua
      - name: Anvil candidate grid / exhaustive parity
        run: |
          lua5.2 tests/test_anvil_grid_parity.lua
          lua5.4 tests/test_anvil_grid_parity.lua
      - name: PixelBox frame identity and phase redraw regressions
        run: |
          lua5.2 tests/test_pixel_frame_diff.lua
          lua5.4 tests/test_pixel_frame_diff.lua
      - name: Read-only performance profile (diagnostic, not timed pass/fail)
        run: |
          lua5.2 tests/performance_profile.lua
          lua5.4 tests/performance_profile.lua
