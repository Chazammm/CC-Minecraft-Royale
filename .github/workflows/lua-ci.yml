name: Lua CI

on:
  push:
    paths-ignore:
      - "reports/**"
  pull_request:
    paths-ignore:
      - "reports/**"

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/assets/
          sparse-checkout-cone-mode: false
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua5.2
      - name: Syntax check
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Lua 5.2 compatibility syntax
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.2 -p
      - name: Lua 5.2 compatibility smoke
        run: |
          lua5.2 tests/test_v1.lua
          lua5.2 tests/test_audit_regressions.lua
          lua5.2 tests/test_headless_runner.lua
          lua5.2 tests/test_side_symmetry.lua
          lua5.2 tests/test_refactor_parity.lua
          lua5.2 tests/test_audit_hardening_20261010.lua
      - name: V1 smoke tests
        run: lua5.4 tests/test_v1.lua
      - name: Platform stub tests
        run: lua5.4 tests/test_platform_stubs.lua
      - name: Audit regression tests
        run: lua5.4 tests/test_audit_regressions.lua
      - name: CLI and manifest tests
        run: lua5.4 tests/test_cli_manifest.lua
      - name: Installer manifest tests
        run: lua5.4 tests/test_install_manifest.lua
      - name: Headless runner parity tests
        run: lua5.4 tests/test_headless_runner.lua
      - name: Side symmetry tests
        run: lua5.4 tests/test_side_symmetry.lua
      - name: Audit follow-up tests
        run: lua5.4 tests/test_audit_followups.lua
      - name: Recovery hardening tests
        run: lua5.4 tests/test_recovery_hardening.lua
      - name: Refactor parity tests
        run: lua5.4 tests/test_refactor_parity.lua
      - name: Installer and combat hardening regressions
        run: lua5.4 tests/test_audit_hardening_20261010.lua
