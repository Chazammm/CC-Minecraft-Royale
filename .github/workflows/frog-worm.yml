name: King Frog and Nether Worm
on:
  push:
    branches: [feature/king-frog-nether-worm-20261016]
  pull_request:
    paths:
      - src/**
      - tests/**
      - assets/sprites/frog_worm/**
      - install.lua
      - mechanics_test.lua
      - .github/workflows/frog-worm.yml
permissions:
  contents: read
jobs:
  mechanics-rendering-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2 lua5.4 fonts-dejavu-core
          python -m pip install Pillow==12.3.0
      - name: All Lua regression suites on both runtimes
        run: |
          for test in tests/test_*.lua; do
            lua5.2 "$test"
            lua5.4 "$test"
          done
      - name: Actual registered sprites, effects and exact previews
        run: |
          lua5.2 tests/test_frog_worm_rendering.lua /tmp/frog-worm52.json
          lua5.4 tests/test_frog_worm_rendering.lua /tmp/frog-worm54.json
          python assets/sprites/frog_worm/tools/previews.py --check --capture52 /tmp/frog-worm52.json --capture54 /tmp/frog-worm54.json
